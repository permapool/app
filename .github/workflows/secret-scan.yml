name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks 8.29.1
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          curl --fail --location --silent --show-error \
            --output gitleaks_8.29.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  gitleaks_8.29.1_linux_x64.tar.gz" \
            | sha256sum --check --strict
          mkdir gitleaks-8.29.1
          tar --extract --gzip \
            --file gitleaks_8.29.1_linux_x64.tar.gz \
            --directory gitleaks-8.29.1 \
            gitleaks
          /tmp/gitleaks-8.29.1/gitleaks version

      - name: Test repository secret-detection rules
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-gitleaks-config.mjs /tmp/gitleaks-8.29.1/gitleaks

      - name: Scan full repository history
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks-8.29.1/gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            .
